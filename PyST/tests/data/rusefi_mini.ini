; Minimale rusEFI-.ini fuer die Tests (Aufbau wie das Original)
#define USE_METRIC_UNITS=true
[MegaTune]
	signature = "rusEFI test.2026.09.30.sim.1" ; Kommentar
[TunerStudio]
	signature= "rusEFI test.2026.09.30.sim.1"
[Constants]
	someSetting = scalar, U16, 0, "rpm", 1, 0
[OutputChannels]
	ochGetCommand	= "O%2o%2c"
	ochBlockSize	= 32
checkEngine = bits, U32, 0, [5:5]
RPMValue = scalar, U16, 4, "RPM", 1, 0
TPSValue = scalar, S16, 6, "%", 0.01, 0
#if USE_METRIC_UNITS
coolant = scalar, S16, 8, "deg C", 0.01, 0
#else
coolant = scalar, S16, 8, "deg F", 0.01, 32
#endif
lambdaValue = scalar, U16, 10, "", 1.0E-4, 0
VBatt = scalar, F32, 12, "V", 1, 0
calcChannel = { RPMValue * 2 }
[Datalog]
entry = RPMValue, "RPM", int, "%d"
entry = TPSValue, "TPS", float, "%.3f"
entry = coolant, "CLT", float, "%.3f"
