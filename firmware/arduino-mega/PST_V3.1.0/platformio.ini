; PST-Mega 3.1.0 - Arduino Mega 2560 (PlatformIO)
; Build:  pio run              Upload: pio run -t upload
; Die Bibliotheken kommen reproduzierbar aus den ZIPs in ../libraries/
; (dieselben Dateien, die man in der Arduino IDE als .ZIP-Bibliothek einbindet).
; Host-Tests (ohne Hardware): make -C test
[platformio]
src_dir = .
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<*> -<test/> -<.pio/>
lib_deps =
    file://../libraries/Adafruit_BusIO-1.17.0.zip
    file://../libraries/Adafruit_MAX31855_library.zip
    file://../libraries/SparkFun_BME280.zip
    Wire
    SPI
build_src_flags = -Wall -Wextra
monitor_speed = 115200
