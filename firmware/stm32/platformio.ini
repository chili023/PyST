; WildBugChilGru PST – STM32F446RE (Nucleo-64) Messelektronik
; Build:  pio run            Upload: pio run -t upload
[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
build_flags = -Iinclude -O2 -DHSE_VALUE=8000000U
build_src_flags = -Wall -Wextra
upload_protocol = mbed
monitor_speed = 115200

; Variante mit starkem Doppelimpulsfilter (70 %) fuer Zuendsignale mit einem
; Stoerimpuls pro Umdrehung (1-Zylinder). Siehe IGN_REL_LOCKOUT_PCT in config.h.
[env:nucleo_f446re_dp70]
extends = env:nucleo_f446re
build_flags = ${env:nucleo_f446re.build_flags} -DIGN_REL_LOCKOUT_PCT=70u
